name: Build TOQUE Death Alert

on:
  push:
    branches: ["main"]
    paths:
      - "server-mod/**"
      - ".github/workflows/build-toque-death-alert.yml"
  pull_request:
    paths:
      - "server-mod/**"
      - ".github/workflows/build-toque-death-alert.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build mod
        working-directory: server-mod
        run: gradle build --no-daemon
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: TOQUE-Death-Alert
          path: server-mod/build/libs/toque-death-alert-*[0-9].jar
